<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishease</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="loading-screen">
    <section class="section nav">
        <div class="title">

            <div class="actions">
                <i data-lucide="panel-left" class="nav-toggle"></i>
            </div>
        </div>

        <nav aria-label="Navigation principale">
            <div class="nav-group-first">
                <a href="#" class="nav-item active">
                    <i data-lucide="house"></i>
                    <span>Accueil</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="folder-git-2"></i>
                    <span>Projets</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="rocket"></i>
                    <span>Déploiements</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="activity"></i>
                    <span>Activité</span>
                </a>
            </div>

            <div class="nav-group">
                <button type="button" class="nav-group-title" aria-expanded="false" aria-controls="nav-taches">
                    <i data-lucide="workflow"></i>
                    <span>Workflows</span>
                    <i data-lucide="chevron-right" class="group-chevron"></i>
                </button>
                <div class="nav-group-items" id="nav-taches" aria-hidden="true" inert>
                    <div class="nav-group-items-inner">
                        <a href="#" class="nav-item nav-item-left">
                            <i data-lucide="list"></i>
                            <span>Tous les runs</span>
                        </a>
                        <a href="#" class="nav-item nav-item-left">
                            <i data-lucide="circle-check-big"></i>
                            <span>Réussis</span>
                        </a>
                        <a href="#" class="nav-item nav-item-left">
                            <i data-lucide="loader"></i>
                            <span>En cours</span>
                        </a>
                        <a href="#" class="nav-item nav-item-left">
                            <i data-lucide="circle-x"></i>
                            <span>Échecs</span>
                        </a>
                        <a href="#" class="nav-item nav-item-left">
                            <i data-lucide="ban"></i>
                            <span>Annulés</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="nav-group">
                <button type="button" class="nav-group-title" aria-expanded="false" aria-controls="nav-equipes">
                    <i data-lucide="globe"></i>
                    <span>Hébergement</span>
                    <i data-lucide="chevron-right" class="group-chevron"></i>
                </button>
                <div class="nav-group-items" id="nav-equipes" aria-hidden="true" inert>
                    <div class="nav-group-items-inner">
                        <a href="#" class="nav-item nav-item-left">
                            <i data-lucide="link-2"></i>
                            <span>Domaines</span>
                        </a>
                        <a href="#" class="nav-item nav-item-left">
                            <i data-lucide="git-pull-request"></i>
                            <span>Environnements</span>
                        </a>
                        <a href="#" class="nav-item nav-item-left">
                            <i data-lucide="braces"></i>
                            <span>Variables</span>
                        </a>
                        <a href="#" class="nav-item nav-item-left">
                            <i data-lucide="bar-chart-3"></i>
                            <span>Analytics</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="nav-group">
                <button type="button" class="nav-group-title" aria-expanded="false" aria-controls="nav-parametres">
                    <i data-lucide="settings"></i>
                    <span>Paramètres</span>
                    <i data-lucide="chevron-right" class="group-chevron"></i>
                </button>
                <div class="nav-group-items" id="nav-parametres" aria-hidden="true" inert>
                    <div class="nav-group-items-inner">
                        <i data-lucide="key-round"></i>
                            <span>Connexion GitHub</span>
                        </a>
                        <a href="#" class="nav-item nav-item-left">
                            <i data-lucide="shield"></i>
                            <span>Sécurité</span>
                        </a>
                        <a href="#" class="nav-item nav-item-left">
                            <i data-lucide="circle-help"></i>
                            <span>Aide</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <footer class="nav-footer">
            <div class="user-profile">
                <div class="user-avatar">TT</div>
                <div class="user-info">
                    <span class="user-name">Téo</span>
                    <span class="user-role">Copilot Chat (de base)</span>
                </div>
                <button type="button" class="user-settings" aria-label="Paramètres du profil">
                    <i data-lucide="square-arrow-left-enter"></i>
                </button>
            </div>
        </footer>
    </section>

    <section class="section content">
        <header class="content-header">
            <span id="content-title">/ Accueil</span>
            <div class="searchbar" id="searchbar">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
                    <circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="1.25"/>
                    <line x1="14.5" y1="14.5" x2="19" y2="19" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
                </svg>
                <span class="placeholder">Rechercher</span>
                <input type="text" class="search-input" placeholder="Rechercher une tâche, un utilisateur..." aria-label="Rechercher une tâche ou un utilisateur"/>
            </div>
        </header>

        <main class="content-body">
            <span>Welcome back</span>
        </main>
    </section>

    <aside class="right-rail" aria-label="Raccourcis rapides">
        <div class="right-rail-actions">
            <button type="button" class="right-rail-item" data-action="new" aria-label="Nouveau projet" title="Nouveau projet"><i data-lucide="plus"></i></button>
            <button type="button" class="right-rail-item" data-action="deploy" aria-label="Déployer" title="Déployer le projet"><i data-lucide="rocket"></i></button>
            <button type="button" class="right-rail-item" data-action="refresh" aria-label="Rafraîchir" title="Rafraîchir"><i data-lucide="refresh-cw"></i></button>
        </div>
        <div class="right-rail-footer">
            <button type="button" class="right-rail-item" aria-label="Paramètres rapides" title="Paramètres">
                <i data-lucide="sliders-horizontal"></i>
            </button>
        </div>
    </aside>

    <script src="app.js"></script>
    <script>
        // Après 3 secondes, la navbar se déploie depuis la gauche.
        // Une seconde plus tard, le header descend depuis le haut.
        window.setTimeout(() => {
            document.body.classList.remove("loading-screen");
            document.body.classList.add("header-hidden");

            window.setTimeout(() => {
                document.body.classList.remove("header-hidden");
            }, 800);
        }, 1200);

        lucide.createIcons();

        function setCollapsed(collapsed) {
            document.body.classList.toggle("nav-collapsed", collapsed);
        }

        document.querySelector(".nav-toggle").addEventListener("click", () => {
            setCollapsed(!document.body.classList.contains("nav-collapsed"));
        });

        document.querySelectorAll(".nav-group-title").forEach((button) => {
            const group = button.closest(".nav-group");
            const panel = document.getElementById(button.getAttribute("aria-controls"));

            if (!group || !panel) return;

            const items = [...panel.querySelectorAll(".nav-item-left")];
            const stagger = 75;

            panel.style.height = "0px";
            panel.style.visibility = "hidden";

            items.forEach((item) => {
                item.style.setProperty("--item-reveal-delay", "0ms");
            });

            const isOpen = () => group.classList.contains("is-open");

            function setOpen(shouldOpen) {
                if (shouldOpen === isOpen()) return;

                const currentHeight = panel.getBoundingClientRect().height;

                panel.style.transition = "none";
                panel.style.height = `${currentHeight}px`;
                panel.getBoundingClientRect();

                items.forEach((item, index) => {
                    const delayIndex = shouldOpen
                        ? index
                        : items.length - 1 - index;

                    item.style.setProperty(
                        "--item-reveal-delay",
                        `${delayIndex * stagger}ms`
                    );
                });

                group.classList.toggle("is-open", shouldOpen);
                button.setAttribute("aria-expanded", String(shouldOpen));
                panel.setAttribute("aria-hidden", String(!shouldOpen));
                panel.inert = !shouldOpen;

                if (shouldOpen) {
                    panel.style.visibility = "visible";
                    panel.style.pointerEvents = "auto";
                } else {
                    panel.style.pointerEvents = "none";
                }

                requestAnimationFrame(() => {
                    panel.style.removeProperty("transition");

                    panel.style.height = shouldOpen
                        ? `${panel.scrollHeight}px`
                        : "0px";
                });
            }

            button.addEventListener("click", () => {
                // Navbar réduite : on la déplie d'abord (sinon le groupe
                // s'ouvrirait de façon invisible).
                if (document.body.classList.contains("nav-collapsed")) {
                    setCollapsed(false);
                    setOpen(true);
                    return;
                }
                setOpen(!isOpen());
            });

            panel.addEventListener("transitionend", (event) => {
                if (event.target !== panel || event.propertyName !== "height") return;

                panel.style.removeProperty("transition");

                if (group.classList.contains("is-open")) {
                    panel.style.height = "auto";
                    panel.style.visibility = "visible";
                } else {
                    panel.style.height = "0px";
                    panel.style.visibility = "hidden";
                }
            });
        });

        // Navigation entre les pages : chaque lien affiche sa propre section.
        const contentTitle = document.getElementById("content-title");
        const contentBody = document.querySelector(".content-body");

        const pageDescriptions = {
            "Projets": "Tes dépôts GitHub : déploie-les en un clic ou crée un nouveau site.",
            "Déploiements": "Historique des déploiements, logs, relance et rollback.",
            "Activité": "Dernière activité de ton compte GitHub.",
            "Tous les runs": "Tous les builds et déploiements du projet sélectionné.",
            "Réussis": "Les déploiements terminés avec succès.",
            "En cours": "Les builds en cours d'exécution (rafraîchis automatiquement).",
            "Échecs": "Les builds en échec, avec leurs logs.",
            "Annulés": "Les builds annulés.",
            "Domaines": "URL GitHub Pages, domaine personnalisé et HTTPS.",
            "Environnements": "Pull requests et branches : déploie n'importe quelle branche.",
            "Variables": "Variables d'environnement utilisables par tes workflows.",
            "Analytics": "Trafic des 14 derniers jours.",
            "Connexion GitHub": "Connecte ton compte avec un token personnel.",
            "Sécurité": "Comment ton token est protégé.",
            "Aide": "Prise en main de Fishease."
        };

        function showPage(label) {
            contentTitle.textContent = `/ ${label}`;

            document.querySelectorAll(".nav-item").forEach((item) => {
                item.classList.toggle(
                    "active",
                    item.querySelector("span")?.textContent.trim() === label
                );
            });

            contentBody.replaceChildren();

            if (label === "Accueil") {
                const greeting = document.createElement("span");
                greeting.textContent = "Bonjour Téo";
                contentBody.appendChild(greeting);
                return;
            }

            const page = document.createElement("section");
            page.className = "page-view app-view";

            const heading = document.createElement("h1");
            heading.textContent = label;

            const description = document.createElement("p");
            description.textContent = pageDescriptions[label]
                || `Bienvenue dans la section ${label}.`;

            page.append(heading, description);
            contentBody.appendChild(page);
            if (window.Deploy) window.Deploy.render(label, page);
        }

        document.querySelectorAll(".nav-item").forEach((item) => {
            item.addEventListener("click", (event) => {
                event.preventDefault();
                const label = item.querySelector("span")?.textContent.trim();
                if (label) showPage(label);
            });
        });

        const searchbar = document.getElementById("searchbar");
        const searchInput = searchbar.querySelector(".search-input");

        searchbar.addEventListener("click", () => {
            searchbar.classList.add("active");
            searchInput.focus();
        });

        searchInput.addEventListener("blur", () => {
            if (searchInput.value.trim() === "") {
                searchbar.classList.remove("active");
            }
        });
    </script>
</body>
</html>
