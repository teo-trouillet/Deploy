<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deploy</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="loading-screen">
    <section class="section nav">
        <div class="title">
            <h1>Deploy</h1>
            <div class="actions">
                <i data-lucide="panel-left" class="nav-toggle"></i>
            </div>
        </div>

        <nav aria-label="Navigation principale">
            <button type="button" class="project-switcher" id="project-switcher" aria-haspopup="listbox" aria-expanded="false" title="Changer de projet">
                <i data-lucide="folder-git-2"></i>
                <span id="project-name">Choisir un projet</span>
                <i data-lucide="chevrons-up-down" class="switcher-chevron"></i>
            </button>
            <div class="nav-pane" id="nav-main">
            <div class="nav-group-first">
                <a href="#" class="nav-item">
                    <i data-lucide="folder-git-2"></i>
                    <span>Projets</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Aperçu</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="rocket"></i>
                    <span>Déploiements</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="terminal"></i>
                    <span>Logs</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="bar-chart-3"></i>
                    <span>Analytics</span>
                </a>
            </div>
            <div class="nav-group-first">
                <a href="#" class="nav-item">
                    <i data-lucide="braces"></i>
                    <span>Variables d'environnement</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="link-2"></i>
                    <span>Domaines</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="folder-open"></i>
                    <span>Fichiers</span>
                </a>
            </div>
            <div class="nav-group-last">
                <a href="#" class="nav-item">
                    <i data-lucide="circle-help"></i>
                    <span>Support</span>
                </a>
                <a href="#" class="nav-item" data-pane="settings">
                    <i data-lucide="settings"></i>
                    <span>Paramètres</span>
                </a>
            </div>
            </div>
            <div class="nav-pane" id="nav-settings" hidden>
                <button type="button" class="nav-back" id="nav-back"><i data-lucide="chevron-left"></i><span>Paramètres</span></button>
            <div class="nav-group-settings">
                <a href="#" class="nav-item">
                    <i data-lucide="sliders-horizontal"></i>
                    <span>Général</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="git-branch"></i>
                    <span>Git</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="layers"></i>
                    <span>Environnements</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="shield"></i>
                    <span>Sécurité</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="activity"></i>
                    <span>Activité</span>
                </a>
            </div>
            </div>
        </nav>

        <footer class="nav-footer">
            <div class="user-profile">
                <div class="user-avatar">TT</div>
                <div class="user-info">
                    <span class="user-name">Téo</span>
                    <span class="user-role">Copilot Chat (de base)</span>
                </div>
                <button type="button" class="user-settings" aria-label="Paramètres du profil">
                    <i data-lucide="square-arrow-left-enter"></i>
                </button>
            </div>
        </footer>
    </section>

    <section class="section content">
        <header class="content-header">
            <span id="content-title">/ Accueil</span>
            <div class="searchbar" id="searchbar">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
                    <circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="1.25"/>
                    <line x1="14.5" y1="14.5" x2="19" y2="19" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
                </svg>
                <span class="placeholder">Rechercher</span>
                <input type="text" class="search-input" placeholder="Rechercher une tâche, un utilisateur..." aria-label="Rechercher une tâche ou un utilisateur"/>
            </div>
        </header>

        <main class="content-body">
            <span>Welcome back</span>
        </main>
    </section>

    <aside class="right-rail" aria-label="Raccourcis rapides">
        <div class="right-rail-actions">
            <button type="button" class="right-rail-item" data-action="new" aria-label="Nouveau projet" title="Nouveau projet"><i data-lucide="plus"></i></button>
            <button type="button" class="right-rail-item" data-action="deploy" aria-label="Déployer" title="Déployer le projet"><i data-lucide="rocket"></i></button>
            <button type="button" class="right-rail-item" data-action="refresh" aria-label="Rafraîchir" title="Rafraîchir"><i data-lucide="refresh-cw"></i></button>
        </div>
        <div class="right-rail-footer">
            <button type="button" class="right-rail-item" aria-label="Paramètres rapides" title="Paramètres">
                <i data-lucide="sliders-horizontal"></i>
            </button>
        </div>
    </aside>

    <script src="app.js"></script>
    <script src="project.js"></script>
    <script>
        // Après 3 secondes, la navbar se déploie depuis la gauche.
        // Une seconde plus tard, le header descend depuis le haut.
        window.setTimeout(() => {
            document.body.classList.remove("loading-screen");
            document.body.classList.add("header-hidden");

            window.setTimeout(() => {
                document.body.classList.remove("header-hidden");
            }, 800);
        }, 1200);

        lucide.createIcons();
        window.setTimeout(() => showPage("Projets"), 1300);

        function setCollapsed(collapsed) {
            document.body.classList.toggle("nav-collapsed", collapsed);
        }

        document.querySelector(".nav-toggle").addEventListener("click", () => {
            setCollapsed(!document.body.classList.contains("nav-collapsed"));
        });

        function setPane(name) {
            document.getElementById("nav-main").hidden = name !== "main";
            document.getElementById("nav-settings").hidden = name !== "settings";
        }
        document.getElementById("nav-back").addEventListener("click", () => setPane("main"));

        // Navigation entre les pages : chaque lien affiche sa propre section.
        const contentTitle = document.getElementById("content-title");
        const contentBody = document.querySelector(".content-body");

        const pageDescriptions = {
            "Général": "Informations du projet sélectionné.",
            "Git": "Connecte ton compte avec un token personnel.",
            "Environnements": "Production et previews par pull request.",
            "Variables d'environnement": "Variables d'environnement utilisables par tes workflows.",
            "Déploiements": "Historique des déploiements, logs, relance et rollback.",
            "Support": "Prise en main de Deploy.",
            "Projets": "Tes dépôts GitHub : sélectionne-en un pour ouvrir son dashboard.",
            "Activité": "Dernière activité de ton compte GitHub.",
            "Aperçu": "Vue d'ensemble du projet sélectionné.",
            "Fichiers": "Parcours, édite et pousse des fichiers directement sur GitHub.",
            "Logs": "Journal des déploiements, commits et pull requests.",
            "Domaines": "URL GitHub Pages, domaine personnalisé et HTTPS.",
            "Analytics": "Trafic des 14 derniers jours.",
            "Sécurité": "Comment ton token est protégé."
        };

        function showPage(label) {
            contentTitle.textContent = `/ ${label}`;

            document.querySelectorAll(".nav-item").forEach((item) => {
                item.classList.toggle(
                    "active",
                    item.querySelector("span")?.textContent.trim() === label
                );
            });

            setPane(document.querySelector(".nav-item.active")?.closest("#nav-settings") ? "settings" : "main");
            contentBody.replaceChildren();

            if (label === "Accueil") {
                const greeting = document.createElement("span");
                greeting.textContent = "Bonjour Téo";
                contentBody.appendChild(greeting);
                return;
            }

            const page = document.createElement("section");
            page.className = "page-view app-view";

            const heading = document.createElement("h1");
            heading.textContent = label;

            const description = document.createElement("p");
            description.textContent = pageDescriptions[label]
                || `Bienvenue dans la section ${label}.`;

            page.append(heading, description);
            contentBody.appendChild(page);
            if (window.Deploy) window.Deploy.render(label, page);
        }

        document.querySelectorAll(".nav-item").forEach((item) => {
            item.addEventListener("click", (event) => {
                event.preventDefault();
                if (item.dataset.pane) { setPane("settings"); return showPage("Général"); }
                const label = item.querySelector("span")?.textContent.trim();
                if (label) showPage(label);
            });
        });

        const searchbar = document.getElementById("searchbar");
        const searchInput = searchbar.querySelector(".search-input");

        searchbar.addEventListener("click", () => {
            searchbar.classList.add("active");
            searchInput.focus();
        });

        searchInput.addEventListener("blur", () => {
            if (searchInput.value.trim() === "") {
                searchbar.classList.remove("active");
            }
        });
    </script>
</body>
</html>
