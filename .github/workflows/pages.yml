# Publie uniquement les fichiers statiques de l'app sur GitHub Pages (pas server/, test/, package.json…).
# Réglages › Pages › Source = « GitHub Actions ». N'utilise pas en même temps le workflow deploy.yml généré par Deploy.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assembler le site
        run: mkdir _site && cp -r index.html landing.html css js _site/
      - uses: actions/configure-pages@v5
      - name: Téléverser l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
